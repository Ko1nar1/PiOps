name: PiOps deploy

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        uses: ./.github/workflows/ci.yml

    deploy:
        needs: validate
        if: github.ref == 'refs/heads/main'
        runs-on: [self-hosted, Linux, ARM64, piops-deploy]
        timeout-minutes: 10

        concurrency:
            group: piops-deploy
            cancel-in-progress: false

        env:
            PIOPS_DEPLOY_DIR: /home/piops-runner/piops-deploy

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Prepare deployment files
              run: |
                  test -r "$PIOPS_DEPLOY_DIR/.env"
                  test -f /home/piops-runner/piops-secrets/ntfy_webhook_url
                  test -r /home/piops-runner/piops-secrets/ntfy_webhook_url
                  test -s /home/piops-runner/piops-secrets/ntfy_webhook_url
                  mkdir -p "$PIOPS_DEPLOY_DIR/monitoring"
                  install -m 644 compose.yaml "$PIOPS_DEPLOY_DIR/compose.yaml"
                  install -m 644 monitoring/prometheus.yml "$PIOPS_DEPLOY_DIR/monitoring/"
                  install -m 644 monitoring/Blackbox.yml "$PIOPS_DEPLOY_DIR/monitoring/"
                  install -m 644 monitoring/alerts.yml "$PIOPS_DEPLOY_DIR/monitoring/"
                  install -m 644 monitoring/alertmanager.yml "$PIOPS_DEPLOY_DIR/monitoring/"

            - name: Validate deployment configuration
              working-directory: ${{ env.PIOPS_DEPLOY_DIR }}
              run: docker compose -p piops --env-file .env -f compose.yaml config --quiet

            - name: Apply Compose changes
              working-directory: ${{ env.PIOPS_DEPLOY_DIR }}
              run: docker compose -p piops --env-file .env -f compose.yaml up -d

            - name: Restart monitoring services
              working-directory: ${{ env.PIOPS_DEPLOY_DIR }}
              run: docker compose -p piops --env-file .env -f compose.yaml restart prometheus blackbox alertmanager

            - name: Wait for Prometheus readiness
              run: |
                  curl --fail --silent --show-error \
                    --retry 30 --retry-all-errors --retry-delay 2 \
                    --max-time 5 http://127.0.0.1:9090/-/ready

            - name: Wait for Alertmanager readiness
              run: |
                  curl --fail --silent --show-error \
                    --retry 30 --retry-all-errors --retry-delay 2 \
                    --max-time 5 http://127.0.0.1:9093/-/ready
