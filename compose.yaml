services:
    podinfo:
        image: ghcr.io/stefanprodan/podinfo:6.15.0
        command: ./podinfo --port=9898 --port-metrics=9797 
        ports:
            - "${PIOPS_BIND_IP:-127.0.0.1}:9898:9898"
        restart: unless-stopped
    prometheus:
        image: prom/prometheus:v3.13.5
        ports:
            - "127.0.0.1:9090:9090"
        volumes:
            - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
            - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro,Z
            - prometheus_data:/prometheus
        mem_limit: 512m
        restart: unless-stopped
    blackbox:
        image: prom/blackbox-exporter:v0.29.1
        volumes:
            - ./monitoring/Blackbox.yml:/etc/blackbox_exporter/config.yml:ro,Z
        restart: unless-stopped
    alertmanager:
        image: prom/alertmanager:v0.34.2
        ports:
            - "127.0.0.1:9093:9093"
        volumes:
            - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z
            - /home/piops-runner/piops-secrets/ntfy_webhook_url:/run/secrets/ntfy_webhook_url:ro,Z
            - alertmanager_data:/alertmanager
        restart: unless-stopped
    grafana:
        image: grafana/grafana:13.3.0
        ports:
            - "127.0.0.1:3000:3000"
        volumes:
            - grafana_data:/var/lib/grafana
        restart: unless-stopped

volumes:
    prometheus_data:
    alertmanager_data:
    grafana_data:
