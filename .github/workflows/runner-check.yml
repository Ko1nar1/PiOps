name: PiOps runner check

on:
    workflow_dispatch:

permissions: {}

jobs:
    runner-check:
        runs-on: [self-hosted, Linux, ARM64, piops-deploy]
        timeout-minutes: 5

        steps:
            - name: Check runner identity
              run: |
                  whoami
                  id
                  uname -m

            - name: Check Docker tools
              run: |
                  docker --version
                  docker compose version

            - name: Check Docker daemon
              run: docker ps
